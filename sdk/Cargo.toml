[package]
name = "dytallix-sdk"
version = "0.1.0"
edition = "2021"
description = "Dytallix SDK for PQC wallet operations"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
ripemd = "0.1"
bech32 = "0.9"
argon2 = "0.5"
zeroize = "1.0"
rand = "0.8"
# PQC dependencies
pqcrypto-dilithium = { version = "0.5.0", optional = true }
pqcrypto-traits = { version = "0.3.5", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["pqc-real"]
pqc-real = ["pqcrypto-dilithium", "pqcrypto-traits"]
pqc-mock = []