
    # QuantumVaultMVP Frontend
    location /QuantumVaultMVP {
        proxy_pass http://127.0.0.1:3000/QuantumVaultMVP;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # QuantumVaultMVP Backend API (Specific match to override general /api/)
    location /api/v1 {
        proxy_pass http://127.0.0.1:13000/api/v1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
