# QuantumVault App
server {
    server_name dytallix.com www.dytallix.com;

    # SSL Configuration
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/dytallix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dytallix.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Blockchain Node API (Proxies /api/blockchain/* to localhost:3030/*)
    location /api/blockchain/ {
        rewrite ^/api/blockchain/(.*) /$1 break;
        proxy_pass http://localhost:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API (Proxies /api/* to localhost:3031/api/*)
    location /api/ {
        proxy_pass http://localhost:3031;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # QuantumVault App
    location /QuantumVaultMVP {
        proxy_pass http://localhost:13002/QuantumVaultMVP;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
    
    # Wallet / Explorer (Main App) - Default Route
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# Redirect HTTP to HTTPS
server {
    if ($host = www.dytallix.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = dytallix.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name dytallix.com www.dytallix.com;
}
