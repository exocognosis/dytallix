    # Blockchain Node API (Proxies /api/blockchain/* to localhost:3030/*)
    location /api/blockchain/ {
        rewrite ^/api/blockchain/(.*) /$1 break;
        proxy_pass http://localhost:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API (Proxies /api/* to localhost:3031/api/*)
    location /api/ {
        proxy_pass http://localhost:3031;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # QuantumVault App
    location /QuantumVaultMVP {
        proxy_pass http://localhost:13002/QuantumVaultMVP;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Sidebar logo asset (requested at domain root by the UI)
    location = /DytallixLogo.png {
        proxy_pass http://localhost:13002/QuantumVaultMVP/DytallixLogo.png;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
