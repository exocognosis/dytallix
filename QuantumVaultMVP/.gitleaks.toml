title = "QuantumVault custom dev-secret policy"

[[rules]]
id = "qv-disallowed-jwt-secret"
description = "Disallowed default JWT secret"
regex = '''(?m)^\s*JWT_SECRET\s*[:=]\s*["']?(your-super-secret-jwt-key-change-in-production|production_secure_jwt_secret_change_me|changeme|change_me)["']?\s*$'''
secretGroup = 1

  [[rules.allowlists]]
  paths = [
    '''^audit/''',
    '''^docs/''',
    '''^.*\.md$''',
    '''^.*\.example$''',
    '''^backend/src/main\.ts$''',
  ]

[[rules]]
id = "qv-disallowed-dev-blockchain-key"
description = "Known development blockchain private key"
regex = '''(?m)^\s*BLOCKCHAIN_PRIVATE_KEY\s*[:=]\s*["']?(0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80|0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff81|0x59c6995e998f97a5a004497e5f4d6f2a2d3526f8f66d74fd9f5bff831f5f3f03)["']?\s*$'''
secretGroup = 1

  [[rules.allowlists]]
  paths = [
    '''^audit/''',
    '''^docs/''',
    '''^.*\.md$''',
    '''^.*\.example$''',
    '''^backend/src/main\.ts$''',
  ]

[[rules]]
id = "qv-disallowed-vault-dev-token"
description = "Disallowed Vault development token"
regex = '''(?m)^\s*(VAULT_TOKEN|VAULT_DEV_ROOT_TOKEN_ID)\s*[:=]\s*["']?(root|local-dev-token-change-me)["']?\s*$'''
secretGroup = 2

  [[rules.allowlists]]
  paths = [
    '''^audit/''',
    '''^docs/''',
    '''^.*\.md$''',
    '''^.*\.example$''',
  ]

[[rules]]
id = "qv-insecure-compose-vault-default"
description = "docker-compose fallback uses known Vault dev token"
regex = '''VAULT_DEV_ROOT_TOKEN_ID\s*:\s*\$\{VAULT_DEV_ROOT_TOKEN_ID:-local-dev-token-change-me\}'''
secretGroup = 0

  [[rules.allowlists]]
  paths = [
    '''^audit/''',
    '''^docs/''',
    '''^.*\.md$''',
  ]
