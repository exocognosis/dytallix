global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: quantumvault-backend
    metrics_path: /api/v1/monitoring/metrics
    authorization:
      type: Bearer
      credentials: qv-monitoring-local-token
    static_configs:
      - targets:
          - backend:3000

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:9464
