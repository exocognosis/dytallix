name: Security Hardening Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
      - 'codex/**'

jobs:
  policy-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run policy checks
        run: |
          chmod +x scripts/ci/policy-checks.sh
          scripts/ci/policy-checks.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (custom policy)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
