upstream dytallix_faucet_backend {
    server 127.0.0.1:3004 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8787 backup;
    keepalive 16;
}

# QuantumVault App / Dytallix Frontend
server {
    server_name dytallix.com www.dytallix.com;

    # SSL Configuration
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/dytallix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dytallix.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Legacy public QuantumVault path now maps to Enterprise frontend route.
    location /quantumvault/ {
        return 301 /enterprise;
    }

    # Blockchain Node RPC (Proxies /api/blockchain/* to localhost:3030/*)
    location /api/blockchain/ {
        proxy_pass http://localhost:3030/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # QuantumVault API (Proxies /api/quantumvault/* to localhost:3031/*)
    location /api/quantumvault/ {
        rewrite ^/api/quantumvault/(.*) /$1 break;
        proxy_pass http://127.0.0.1:3031/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Aegis API + WebSocket (Proxies /api/aegis/* to localhost:8787)
    location /api/aegis/ {
        proxy_pass http://127.0.0.1:8787/api/aegis/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # QuantumVaultMVP Backend API
    location /api/v1 {
        proxy_pass http://localhost:13000/api/v1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Main Backend API - Wallet, Faucet, Explorer (Proxies /api/* to localhost:8787/*)
    location /api/faucet/ {
        proxy_pass http://dytallix_faucet_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # QuantumVault App
    location /QuantumVaultMVP {
        proxy_pass http://localhost:13002/QuantumVaultMVP;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Legacy Wallet/Explorer API on port 3000 - specific routes only
    location /wallet-api/ {
        rewrite ^/wallet-api/(.*) /$1 break;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
    
    # Dytallix Pay Dashboard
    location = /dytallixpay/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location ^~ /dytallixpay {
        try_files $uri $uri/ /dytallixpay/index.html;
    }

    # Dytallix Pay API
    location /api/dytallixpay/ {
        rewrite ^/api/dytallixpay/(.*) /$1 break;
        proxy_pass http://localhost:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve static files from /usr/share/nginx/html
    location / {
        try_files $uri /index.html;
    }
}

# Redirect HTTP to HTTPS
server {
    if ($host = www.dytallix.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = dytallix.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name dytallix.com www.dytallix.com;
}
