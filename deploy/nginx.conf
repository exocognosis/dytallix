user  nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json application/xml+rss;
  client_max_body_size 1m;

  map $http_origin $cors_allow {
    default "";
    "~^https://(www\.)?dytallix\.com$" $http_origin;
    "~^https://staging\.dytallix\.com$" $http_origin;
  }

  upstream dyt_api {
    server backend:8787;
    keepalive 16;
  }

  server { listen 80; server_name dytallix.com www.dytallix.com; return 301 https://$host$request_uri; }

  server {
    listen 443 ssl http2;
    server_name dytallix.com www.dytallix.com;

    ssl_certificate     /etc/ssl/dytallix/fullchain.pem;
    ssl_certificate_key /etc/ssl/dytallix/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests" always;

    root /var/www/dytallix;
    index index.html;

    location /api {
      proxy_pass http://dyt_api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      if ($cors_allow != "") {
        add_header Access-Control-Allow-Origin $cors_allow;
        add_header Vary Origin;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        add_header Access-Control-Allow-Methods "GET,POST,OPTIONS";
      }
      if ($request_method = OPTIONS) { return 204; }
    }

    location / { try_files $uri $uri/ /index.html; }
  }
}