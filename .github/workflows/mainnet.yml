name: Mainnet

on:
  push:
    branches: [main]
    paths:
      - 'mainnet/**'
      - '!mainnet/**/*.md'
      - '.github/workflows/mainnet.yml'
  pull_request:
    paths:
      - 'mainnet/**'
      - '!mainnet/**/*.md'
      - '.github/workflows/mainnet.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mainnet-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Debug info roughly triples target/ size and is not needed in CI.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  node-consensus:
    name: Node (mainnet consensus build)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mainnet/node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        working-directory: /
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: mainnet/node
          key: consensus
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake pkg-config
      - name: Module boundaries
        run: |
          python3 scripts/check_module_boundaries.py
          python3 -B -m unittest discover -s scripts -p test_module_boundaries.py
      # The G35 check reads the locked graph offline; fetch it first.
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: No quantum-vulnerable crypto in the consensus dependency graph (G35)
        run: python3 scripts/check_consensus_cargo_profile.py --output "$RUNNER_TEMP/consensus-profile.json"
      - name: Cryptographic routes match the E01 inventory
        run: python3 scripts/e01_inventory.py --check
      - name: Helper ownership and native execution policy (E02)
        run: |
          python3 scripts/check_helper_control.py
          python3 -B -m unittest discover -s scripts -p test_check_helper_control.py
          python3 -B -m unittest discover -s tools/native-execution-policy -p 'test_*.py'
      # The test profile optimizes the PQC crates, so a dev-profile build
      # would compile the workspace a second time in the Test step.
      - name: Build all targets
        run: cargo build --workspace --all-targets --locked --profile test
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
      - name: PQC HTTP adapter
        run: cargo test --locked --manifest-path consensus/pqc-http-adapter/Cargo.toml

  consensus-engine:
    name: Consensus engine (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mainnet/node/consensus/cometbft/go.mod
          cache-dependency-path: mainnet/node/consensus/*/go.sum
      - name: Vet and test
        run: |
          for module in cometbft owner-guard root-authorization; do
            echo "::group::$module"
            (cd "mainnet/node/consensus/$module" && go vet -mod=readonly ./... && go test -mod=readonly ./...)
            echo "::endgroup::"
          done
      # Production binaries use these tags; the default-tag build above keeps
      # upstream's classical code paths for comparison only.
      - name: PQC-only vet, test and production build
        working-directory: mainnet/node/consensus/cometbft
        env:
          TAGS: dytallix_pqc_only,dytallix_pqc_ipc
        run: |
          go vet -mod=readonly -tags "$TAGS" ./...
          go test -mod=readonly -tags "$TAGS" ./... github.com/cometbft/cometbft/privval github.com/cometbft/cometbft/node
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -mod=readonly -trimpath -buildvcs=false \
            -tags "$TAGS" -o "$RUNNER_TEMP/pqc/" ./cmd/dytallix-pqc-engine ./cmd/dytallix-comet-bridge
      - name: No quantum-vulnerable crypto in the PQC-only Go graphs (G35)
        working-directory: mainnet/node
        run: |
          python3 -B -m unittest discover -s scripts -p test_consensus_go_graph.py
          python3 scripts/check_consensus_go_graph.py --output "$RUNNER_TEMP/consensus-go-graph.json"
      - name: Build engine binaries
        working-directory: mainnet/node/consensus/cometbft
        run: |
          go build -mod=readonly -o "$RUNNER_TEMP/bin/" ./cmd/...
          go build -mod=readonly -o "$RUNNER_TEMP/bin/cometbft" github.com/cometbft/cometbft/cmd/cometbft

  # E02 kernel checks on a disposable runner (AppArmor, root). Diagnostic only;
  # T03 qualifies the frozen service candidate.
  e02-native:
    name: E02 helper ownership (native AppArmor diagnostic)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mainnet/node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mainnet/node/consensus/root-authorization/go.mod
          cache-dependency-path: mainnet/node/consensus/*/go.sum
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.88.0
      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y apparmor apparmor-utils gcc libc6-dev linux-libc-dev
      - name: Build helper, fixture and Rust fixtures
        run: |
          out="$RUNNER_TEMP/e02"
          mkdir -p "$out/fixture"
          (cd consensus/root-authorization \
            && CGO_ENABLED=0 go build -mod=readonly -trimpath -buildvcs=false -o "$out/root-verify" ./cmd/dytallix-root-verify \
            && DYT_E02_FIXTURE_DIR="$out/fixture" go test -mod=readonly -count=1 -run TestExportHelperQualificationFixture .)
          # Static, so the rendered supervisor profile needs no shared libraries.
          RUSTFLAGS="-C target-feature=+crt-static" cargo build --locked --release \
            --target x86_64-unknown-linux-gnu -p dytallix-release-runtime --features qualification-fixtures \
            --bin release-runtime-profile-admission
          cargo build --locked --release -p dytallix-release-runtime --features qualification-fixtures \
            --bin release-runtime-pause-qualification
      - name: Native checks
        run: |
          out="$RUNNER_TEMP/e02"
          sudo python3 tools/native-execution-policy/e02_native/run_e02_native.py \
            --go-helper "$out/root-verify" --fixture-dir "$out/fixture" \
            --admission-bin target/x86_64-unknown-linux-gnu/release/release-runtime-profile-admission \
            --pause-bin target/release/release-runtime-pause-qualification \
            --output-dir "$out/result"
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/e02/result/E02_NATIVE_SUMMARY.json" || true

  sdk:
    name: SDK and CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mainnet/sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: mainnet/sdk
      - name: Test
        run: cargo test --workspace --locked
