version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: dytallixpay_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dytallixpay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: dytallixpay_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
