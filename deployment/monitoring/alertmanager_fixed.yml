global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@dytallix.com'
  smtp_auth_username: 'alerts@dytallix.com'
  smtp_auth_password_file: '/etc/alertmanager/smtp_password'
  slack_api_url_file: '/etc/alertmanager/slack_webhook'

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 30m
      
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 2m
      repeat_interval: 4h

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

receivers:
  - name: 'default'
    slack_configs:
      - channel: '#dytallix-alerts'
        title: 'Dytallix Testnet Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}
        send_resolved: true
        
  - name: 'critical-alerts'
    slack_configs:
      - channel: '#dytallix-critical'
        title: '🚨 CRITICAL: Dytallix Testnet Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Instance:* {{ .Labels.instance }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}
        send_resolved: true
        color: 'danger'
    email_configs:
      - to: 'ops-team@dytallix.com'
        subject: 'CRITICAL Dytallix Alert - {{ .GroupLabels.alertname }}'
        body: |
          Critical alert in Dytallix testnet:
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          {{ if .Annotations.runbook_url }}Runbook: {{ .Annotations.runbook_url }}{{ end }}
          {{ end }}
          
          Please investigate immediately.
        
  - name: 'warning-alerts'
    slack_configs:
      - channel: '#dytallix-warnings'
        title: '⚠️ WARNING: Dytallix Testnet Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}
        send_resolved: true
        color: 'warning'